[project]
name = "sigma-fresher"
version = "0.1.0"
description = "Secure resume-driven web job search and aggregation platform built with Django 6."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0",
    "celery>=5.4.0",
    "defusedxml>=0.7.1",
    "django>=6.0,<7.0",
    "django-allauth[mfa,socialaccount]>=65.0.0",
    "django-environ>=0.12.0",
    "django-filter>=25.1",
    "django-structlog>=9.0.0",
    "filetype>=1.2.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "nh3>=0.2.20",
    "openai>=1.60.0",
    "pdfplumber>=0.11.4",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
    "redis>=5.2.0",
    "whitenoise>=6.8.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "django-stubs>=5.1.0",
    "mypy>=1.14.0",
    "pip-audit>=2.7.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
strict_optional = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
