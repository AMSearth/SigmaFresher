services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigma_fresher}
      POSTGRES_USER: ${POSTGRES_USER:-sigma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigma_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigma} -d ${POSTGRES_DB:-sigma_fresher}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sigma}:${POSTGRES_PASSWORD:-sigma_dev_pass}@db:5432/${POSTGRES_DB:-sigma_fresher}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-default:
    build: .
    command: celery -A config worker -Q default -l info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sigma}:${POSTGRES_PASSWORD:-sigma_dev_pass}@db:5432/${POSTGRES_DB:-sigma_fresher}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
      - media_data:/app/media
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-scraper:
    build: .
    command: celery -A config worker -Q scraper -l info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sigma}:${POSTGRES_PASSWORD:-sigma_dev_pass}@db:5432/${POSTGRES_DB:-sigma_fresher}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sigma}:${POSTGRES_PASSWORD:-sigma_dev_pass}@db:5432/${POSTGRES_DB:-sigma_fresher}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
